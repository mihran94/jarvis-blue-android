# ---- JVM / Gradle ----
# Tuned for a small build host (2 vCPU / 3 GB RAM). Raise on a workstation.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=900m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true

# Run kotlinc inside the Gradle daemon instead of spawning a second JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ---- Room / KSP ----
ksp.incremental=true

# ---- Packaging ----
org.gradle.warning.mode=summary
