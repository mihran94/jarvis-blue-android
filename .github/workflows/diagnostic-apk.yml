name: Diagnostic APK security build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/check_sensitive_services.py'
      - '.github/workflows/diagnostic-apk.yml'
  push:
    branches:
      - security/minimal-permission-diagnostic-20261112
    paths:
      - 'app/**'
      - 'scripts/check_sensitive_services.py'
      - '.github/workflows/diagnostic-apk.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore wrapper
        run: |
          bash gradle/wrapper/restore-wrapper.sh
          chmod +x gradlew
      - name: Verify consent guard
        run: python3 scripts/check_sensitive_services.py
      - name: Build diagnostic APK
        run: ./gradlew :app:assembleDiagnostic --no-daemon --console=plain --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8'
      - name: Verify manifest and record SHA256
        run: |
          set -eu
          APK=app/build/outputs/apk/diagnostic/app-diagnostic.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee diagnostic-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > diagnostic-manifest.txt
          if grep -Eq 'android.permission.(SYSTEM_ALERT_WINDOW|USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|RECEIVE_BOOT_COMPLETED)' diagnostic-permissions.txt; then
            echo "Unexpected sensitive permission in diagnostic APK" >&2
            exit 1
          fi
          if grep -Eq 'JarvisAccessibilityService|JarvisNotificationListenerService|BootReceiver' diagnostic-manifest.txt; then
            echo "Unexpected sensitive service in diagnostic APK" >&2
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee diagnostic-signing.txt
          grep -q 'Verifies' diagnostic-signing.txt
          sha256sum "$APK" | tee diagnostic-apk.sha256
      - name: Upload diagnostic APK for authorized device testing
        uses: actions/upload-artifact@v4
        with:
          name: JarvisBlue-DIAGNOSTIC-DEBUG-NOT-FOR-RELEASE
          path: app/build/outputs/apk/diagnostic/app-diagnostic.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload audit reports only
        uses: actions/upload-artifact@v4
        with:
          name: JarvisBlue-diagnostic-security-report
          path: |
            diagnostic-permissions.txt
            diagnostic-manifest.txt
            diagnostic-apk.sha256
            diagnostic-signing.txt
          retention-days: 14
