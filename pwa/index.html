<!doctype html><html lang="ta"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07142c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>JARVIS BLUE</title><style>body{background:#07142c;color:#eef8ff;font:16px system-ui;margin:0}main{max-width:520px;margin:auto;padding:25px}h1{text-align:center;color:#49cfff}.orb{width:140px;height:140px;margin:35px auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c9ffff,#1985ff 48%,#0c236d);box-shadow:0 0 70px #168aff}input,textarea,button{box-sizing:border-box;width:100%;margin:9px 0;padding:15px;border-radius:14px;font:inherit}input,textarea{background:#102746;color:white;border:1px solid #3d658e}button{border:0;background:#1679ed;color:white;font-weight:bold}p{color:#adc7df}#answer{white-space:pre-wrap}</style><main><h1>JARVIS BLUE</h1><p><a href="./remote.html" style="color:#5ad8ff">🖥 Windows PC Remote Control</a></p><div class="orb"></div><p id="status">Your AI companion — Tamil & English</p><input id="key" type="password" placeholder="Gemini API key (this session only)"><textarea id="question" rows="3" placeholder="Ask JARVIS..."></textarea><button id="voice">🎙 Speak</button><button id="camera">📷 Select photo</button><input id="photo" type="file" accept="image/*" capture="environment" hidden><button id="send">Send to Gemini</button><p id="answer"></p><p>Prototype: browser voice support varies; Gemini Live and PC control are not yet included. HTTPS required.</p></main><script>let photo=null;const el=id=>document.getElementById(id),status=s=>el('status').textContent=s;el('camera').onclick=()=>el('photo').click();el('photo').onchange=()=>{const f=el('photo').files[0];if(!f)return;if(f.size>7000000){status('Photo too large');return}const r=new FileReader();r.onload=()=>{photo={mime_type:f.type,data:r.result.split(',')[1]};status('Photo ready')};r.readAsDataURL(f)};el('voice').onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){status('Speech recognition unavailable; type instead');return}const r=new S();r.lang='ta-IN';r.onresult=e=>{el('question').value=e.results[0][0].transcript};r.onerror=e=>status(e.error);r.start();status('Listening')};el('send').onclick=async()=>{const key=el('key').value.trim(),q=el('question').value.trim();if(!key||(!q&&!photo)){status('Enter API key and a question/photo');return}status('Thinking...');el('send').disabled=true;try{const parts=[{text:q||'Describe this image in Tamil'}];if(photo)parts.push({inline_data:photo});const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}]})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'API error');el('answer').textContent=(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('\\n');status('Ready');photo=null}catch(e){status('Error: '+e.message)}finally{el('send').disabled=false}}</script></html>
