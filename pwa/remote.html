<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07142c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>JARVIS BLUE Remote</title><style>body{background:#07142c;color:#eaf5ff;font:16px system-ui;margin:0}main{max-width:540px;margin:auto;padding:24px}h1{color:#4bcaff}p{color:#abc8e4}input,button{box-sizing:border-box;width:100%;padding:15px;border-radius:13px;margin:8px 0;font:inherit}input{background:#132847;border:1px solid #42668b;color:white}button{background:#147bf3;color:white;border:0;font-weight:650}button:disabled{opacity:.55}#result{white-space:pre-wrap}</style></head><body><main><h1>JARVIS BLUE</h1><p>Private Windows PC control</p><label>Windows Agent access token (not saved)</label><input id="token" type="password" autocomplete="off" placeholder="Paste the secret token"><label for="appname">Open any installed application</label><input id="appname" placeholder="e.g. VLC, Photoshop, Blender"><button id="openapp">🚀 Open app by name</button><button data-command="status">🖥 Check PC status</button><button data-command="chrome">🌐 Open browser</button><button data-command="after-effects">🎬 Open After Effects</button><button data-command="downloads">📁 Open Downloads</button><p id="result" role="status">Connect to your private Tailscale HTTPS address. Keep the PC awake and signed in.</p><p>Only the listed commands are permitted. No arbitrary shell commands or file deletion.</p></main><script>const result=document.getElementById('result');document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',async()=>{const token=document.getElementById('token').value.trim();if(!token){result.textContent='Enter your access token';return}button.disabled=true;result.textContent='Sending securely…';try{const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({command:button.dataset.command})});const data=await response.json();result.textContent=data.result||data.error||'Unknown response'}catch(e){result.textContent='Connection error: '+e.message}finally{button.disabled=false}}))document.getElementById('openapp').addEventListener('click',async()=>{const token=document.getElementById('token').value.trim(),app=document.getElementById('appname').value.trim(),button=document.getElementById('openapp');if(!token||!app){result.textContent='Enter token and application name';return}button.disabled=true;result.textContent='Looking for app…';try{const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({command:'open-app',app})});const data=await response.json();result.textContent=data.result||data.error||'Unknown response'}catch(e){result.textContent='Connection error: '+e.message}finally{button.disabled=false}});</script></body></html>
